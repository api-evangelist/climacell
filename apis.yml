aid: climacell
name: Climacell
description: >-
  Climacell (styled ClimaCell) was a Boston-based weather-intelligence startup that pioneered a "Weather of Things"
  approach — deriving hyperlocal precipitation and atmospheric conditions from wireless-signal attenuation, connected
  devices, and its own proprietary numerical weather model — and exposed it through a developer-facing REST weather API.
  Backed by Canaan Partners among others, the company rebranded to Tomorrow.io in 2020 and its legacy climacell.co
  domain now 301-redirects to www.tomorrow.io. The surviving product is the Tomorrow.io v4 Weather API, which
  supersedes the original ClimaCell v3 API and exposes 60+ hyperlocal data layers (core weather, air quality, pollen,
  fire, flood, lightning, maritime, aviation, road) with realtime, forecast, historical, map-tile, and webhook-alert
  access. This profile is the historical ClimaCell identity; the enriched, live provider record lives in the
  api-evangelist tomorrow-io repository.
